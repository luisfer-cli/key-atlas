name: Build Windows release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install AutoHotkey compiler
        shell: pwsh
        run: choco install autohotkey --version=2.0.19 --yes --no-progress

      - name: Compile and package
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $compiler = Get-ChildItem "$env:ProgramFiles\AutoHotkey" -Filter Ahk2Exe.exe -Recurse |
            Select-Object -First 1
          $base = @("AutoHotkey64.exe", "AutoHotkey.exe") |
            ForEach-Object {
              Get-ChildItem "$env:ProgramFiles\AutoHotkey" -Filter $_ -Recurse |
                Select-Object -First 1
            } |
            Where-Object { $_ } |
            Select-Object -First 1
          if (-not $compiler -or -not $base) {
            throw "AutoHotkey compiler or v2 base executable was not installed."
          }

          $packageRoot = Join-Path $env:GITHUB_WORKSPACE "dist\KeyAtlas"
          New-Item -ItemType Directory -Force $packageRoot | Out-Null
          & $compiler.FullName /in "$env:GITHUB_WORKSPACE\KeyAtlas.ahk" `
            /out "$packageRoot\KeyAtlas.exe" /base $base.FullName
          if ($LASTEXITCODE -ne 0) {
            throw "Ahk2Exe failed with exit code $LASTEXITCODE."
          }

          if (Test-Path "$env:GITHUB_WORKSPACE\assets\*") {
            Copy-Item "$env:GITHUB_WORKSPACE\assets" $packageRoot -Recurse
          }
          Copy-Item "$env:GITHUB_WORKSPACE\config" $packageRoot -Recurse
          Copy-Item "$env:GITHUB_WORKSPACE\data" $packageRoot -Recurse
          Copy-Item "$env:GITHUB_WORKSPACE\installer\*.ps1" $packageRoot
          Copy-Item "$env:GITHUB_WORKSPACE\README-Windows.md" $packageRoot

          $version = if ("${{ github.ref }}" -like "refs/tags/*") {
            "${{ github.ref_name }}"
          } else {
            "dev-${{ github.sha }}"
          }
          $packagePath = Join-Path $env:GITHUB_WORKSPACE "dist\KeyAtlas-$version-windows-x64.zip"
          Compress-Archive -Path "$packageRoot\*" -DestinationPath $packagePath
          "path=$packagePath" >> $env:GITHUB_OUTPUT

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: key-atlas-windows-x64
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error
          retention-days: 30


  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: key-atlas-windows-x64
          path: dist

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $packagePath = Get-ChildItem "dist" -Filter "*.zip" | Select-Object -First 1
          if (-not $packagePath) {
            throw "Windows release package was not found."
          }
          if (gh release view $env:TAG 2>$null) {
            gh release upload $env:TAG $packagePath.FullName --clobber
          } else {
            gh release create $env:TAG $packagePath.FullName --title "Key Atlas $env:TAG" --generate-notes
          }
