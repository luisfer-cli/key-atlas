name: Build Windows release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install AutoHotkey v2 and compiler
        id: ahk
        uses: holy-tao/install-autohotkey@5fcf9decd4b1fe65f4f78a8e7ae2ed7a18014cf7 # v2.1.0
        with:
          version: "2.0.19"
          compiler: latest

      - name: Compile and package
        id: package
        shell: pwsh
        env:
          AHK2EXE: ${{ steps.ahk.outputs.ahk2Exe }}
          AHK64: ${{ steps.ahk.outputs.ahk64 }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:AHK2EXE -or -not (Test-Path $env:AHK2EXE)) {
            throw "Ahk2Exe was not installed."
          }
          if (-not $env:AHK64 -or -not (Test-Path $env:AHK64)) {
            throw "AutoHotkey64.exe was not installed."
          }

          $packageRoot = Join-Path $env:GITHUB_WORKSPACE "dist\KeyAtlas"
          New-Item -ItemType Directory -Force $packageRoot | Out-Null
          & $env:AHK2EXE /in "$env:GITHUB_WORKSPACE\KeyAtlas.ahk" `
            /out "$packageRoot\KeyAtlas.exe" /base $env:AHK64
          if ($LASTEXITCODE -ne 0) {
            throw "Ahk2Exe failed with exit code $LASTEXITCODE."
          }

          if (Test-Path "$env:GITHUB_WORKSPACE\assets\*") {
            Copy-Item "$env:GITHUB_WORKSPACE\assets" $packageRoot -Recurse
          }
          Copy-Item "$env:GITHUB_WORKSPACE\config" $packageRoot -Recurse
          Copy-Item "$env:GITHUB_WORKSPACE\data" $packageRoot -Recurse
          Copy-Item "$env:GITHUB_WORKSPACE\installer\*.ps1" $packageRoot
          Copy-Item "$env:GITHUB_WORKSPACE\README-Windows.md" $packageRoot

          $version = if ($env:REF -like "refs/tags/*") {
            $env:REF_NAME
          } else {
            "dev-$env:COMMIT_SHA"
          }
          foreach ($invalidChar in [IO.Path]::GetInvalidFileNameChars()) {
            $version = $version.Replace($invalidChar, "-")
          }
          $packagePath = Join-Path $env:GITHUB_WORKSPACE "dist\KeyAtlas-$version-windows-x64.zip"
          Compress-Archive -Path "$packageRoot\*" -DestinationPath $packagePath
          "path=$packagePath" >> $env:GITHUB_OUTPUT

      - name: Upload Windows package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: key-atlas-windows-x64
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - name: Download Windows package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: key-atlas-windows-x64
          path: dist

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $packagePath = Get-ChildItem "dist" -Filter "*.zip" | Select-Object -First 1
          if (-not $packagePath) {
            throw "Windows release package was not found."
          }
          if (gh release view $env:TAG 2>$null) {
            gh release upload $env:TAG $packagePath.FullName --clobber
          } else {
            gh release create $env:TAG $packagePath.FullName --title "Key Atlas $env:TAG" --generate-notes
          }
